# Hyprland Configuration File
# ~/.config/hypr/hyprland.conf

# Monitor configuration
# monitor=,preferred,auto,auto

monitor=HDMI-A-1,3840x2160@119.88,0x0,1

xwayland {
   force_zero_scaling = true
}

exec-once = xrdb -merge ~/.Xresources

# Input configuration
input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# General configuration
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    allow_tearing = false
}

# Decoration
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Animations
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layout
dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}

# Gestures
gestures {
    workspace_swipe = off
}

# Misc
misc {
    force_default_wallpaper = -1
}

# Wallpaper
exec-once = hyprpaper

# Panel
exec-once = hyprpanel

# Application launcher
exec-once = ulauncher --hide-window

# Window rules
windowrulev2 = suppressevent maximize, class:.*

# Keybindings
$mainMod = SUPER

# Terminal
bind = $mainMod, Return, exec, kitty

# Application launcher
bind = $mainMod, D, exec, ulauncher-toggle
windowrulev2 = stayfocused, class:ulauncher
windowrulev2 = noborder, class:ulauncher

# Workspace navigation (Super + 1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to workspace (Super + Shift + 1-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Window management
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + vim keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Resize windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, resizeactive, -20 0
bind = $mainMod SHIFT, right, resizeactive, 20 0
bind = $mainMod SHIFT, up, resizeactive, 0 -20
bind = $mainMod SHIFT, down, resizeactive, 0 20

# Resize windows with mainMod + SHIFT + vim keys
bind = $mainMod SHIFT, h, resizeactive, -20 0
bind = $mainMod SHIFT, l, resizeactive, 20 0
bind = $mainMod SHIFT, k, resizeactive, 0 -20
bind = $mainMod SHIFT, j, resizeactive, 0 20

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and draggingss
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move windows (reorder them)
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# Move windows with vim keys
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

# Additional useful keybindings
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, Q, exec, hyprctl kill

# Application launcher (if you have one installed)
bind = $mainMod, SPACE, exec, ulauncher-toggle

# Screenshot (if you have grim and slurp installed)
# bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
# bind = SHIFT, Print, exec, grim - | wl-copy

# Volume controls (if you have pamixer installed)
# bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
# bind = , XF86AudioLowerVolume, exec, pamixer -d 5
# bind = , XF86AudioMute, exec, pamixer -t

# Custom config for some apps

# Scratchpads

## Scratchpad for Obsidian
bind = $mainMod, O, togglespecialworkspace, obsidian

# Window rules for Obsidian scratchpad
windowrulev2 = workspace special:obsidian, class:(obsidian)

# Auto-start Obsidian in scratchpad
exec-once = [workspace special:obsidian] obsidian

## Scratchpad for OBS
bind = $mainMod, Y, togglespecialworkspace, obs

# Window rules for OBS scratchpad
windowrulev2 = workspace special:obs, class:(com.obsproject.Studio)

# Auto-start OBS in scratchpad
exec-once = [workspace special:obs] QT_AUTO_SCREEN_SCALE_FACTOR=1 obs
