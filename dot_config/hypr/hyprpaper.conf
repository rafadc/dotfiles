# Hyprpaper Configuration File
# ~/.config/hypr/hyprpaper.conf

# Preload the wallpaper
preload = ~/Pictures/Wallpapers/night-artwork-futuristic-city-cyberpunk-wallpaper-c8566d2840c05c8810fcb14ec8d2643a

# Set the wallpaper for all monitors
wallpaper = ,~/Pictures/Wallpapers/night-artwork-futuristic-city-cyberpunk-wallpaper-c8566d2840c05c8810fcb14ec8d2643a

# Enable splash text
splash = false

# Enable IPC
ipc = on
